<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Bridge | Premium Exam Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ielts-accent: #e11d48;
            --topik-accent: #2563eb;
            --dark-bg: #020617;
            --transition-smooth: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            overflow: hidden;
            height: 100vh;
            color: white;
        }

        /* --- Animations --- */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }

        @keyframes scan {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        @keyframes reveal {
            from { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        /* --- Header & Lang --- */
        .header-ui {
            position: fixed;
            top: 40px;
            width: 100%;
            padding: 0 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .lang-switcher {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 6px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
        }

        .lang-btn {
            padding: 10px 24px;
            border-radius: 100px;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.6);
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .lang-btn.active {
            background: white;
            color: black;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        /* --- Layout --- */
        .main-gateway {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .side {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
            text-decoration: none;
            overflow: hidden;
        }

        .side:hover { flex: 1.4; }

        /* --- Backgrounds with Parallax effect --- */
        .bg-layer {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: var(--transition-smooth);
            z-index: 0;
            filter: brightness(0.4) saturate(1.1);
        }

        /* IELTS Background - Global/Library vibes */
        .ielts-side .bg-layer {
            background-image: url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=2070&auto=format&fit=crop');
        }

        /* TOPIK Background - Korean Academic/Seoul vibes */
        .topik-side .bg-layer {
            background-image: url('https://images.unsplash.com/photo-1538481199705-c710c4e965fc?q=80&w=2070&auto=format&fit=crop');
        }

        .side:hover .bg-layer {
            transform: scale(1.1);
            filter: brightness(0.5);
        }

        /* Gradient Overlay */
        .side::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(2,6,23,0) 0%, rgba(2,6,23,0.85) 90%);
            z-index: 1;
        }

        /* --- Center Divider --- */
        .divider {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(255,255,255,0.1);
            z-index: 10;
            transform: translateX(-50%);
        }

        .divider-scanner {
            position: absolute;
            width: 2px;
            height: 120px;
            background: linear-gradient(to bottom, transparent, #fff, transparent);
            left: -0.5px;
            animation: scan 4s infinite linear;
        }

        .center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            background: var(--dark-bg);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 25px 35px;
            border-radius: 24px;
            backdrop-filter: blur(20px);
            text-align: center;
            pointer-events: none;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* --- Footer Credit --- */
        .footer-credit {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.4;
            pointer-events: none;
        }

        /* --- Content UI --- */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
            padding: 40px;
            animation: reveal 1.5s var(--transition-smooth);
        }

        .badge {
            display: inline-block;
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 25px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(5px);
        }

        h2 {
            font-size: 6rem;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -5px;
            line-height: 0.9;
        }

        p {
            font-size: 1.15rem;
            opacity: 0.7;
            max-width: 440px;
            margin: 0 auto 45px;
            font-weight: 300;
            line-height: 1.6;
        }

        .cta-btn {
            padding: 22px 55px;
            border-radius: 100px;
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.05);
            color: white;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.4s ease;
            backdrop-filter: blur(10px);
        }

        .cta-btn:hover {
            transform: translateY(-5px);
            background: white;
            color: black;
            border-color: white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        /* --- Floating Elements --- */
        .floating-shape {
            position: absolute;
            z-index: 1;
            opacity: 0.08;
            filter: blur(1px);
            animation: float 12s infinite ease-in-out;
            user-select: none;
        }

        @media (max-width: 900px) {
            .main-gateway { flex-direction: column; }
            h2 { font-size: 4rem; }
            .divider, .center-logo { display: none; }
            .side:hover { flex: 1; }
            .footer-credit { bottom: 15px; font-size: 9px; }
        }
    </style>
</head>
<body>

    <header class="header-ui">
        <div style="font-weight: 800; font-size: 20px; letter-spacing: 2px;">TEST BRIDGE</div>
        <nav class="lang-switcher">
            <button class="lang-btn active" onclick="switchLang('en')">EN</button>
            <button class="lang-btn" onclick="switchLang('ko')">KO</button>
        </nav>
    </header>

    <div class="divider">
        <div class="divider-scanner"></div>
    </div>

    <div class="center-logo">
        <div style="font-size: 10px; opacity: 0.5; font-weight: 800; letter-spacing: 3px;">EST. 2026</div>
        <div style="font-weight: 800; font-size: 24px; letter-spacing: -1px;">DSU</div>
    </div>

    <div class="footer-credit">Created by Ahadbek & Asadbek</div>

    <main class="main-gateway">
        <a href="/ielts" class="side ielts-side">
            <div class="bg-layer"></div>
            <div class="floating-shape" style="top: 15%; left: 10%; font-size: 120px; font-weight: 900;">ENG</div>

            <div class="content">
                <span class="badge" data-key="ielts-badge">Global Standards</span>
                <h2>IELTS</h2>
                <p data-key="ielts-desc">Elevate your global career with our precision-engineered mock examinations and analytics.</p>
                <button class="cta-btn" data-key="enter-btn">Open Application</button>
            </div>
        </a>

        <a href="/topik" class="side topik-side">
            <div class="bg-layer"></div>
            <div class="floating-shape" style="bottom: 15%; right: 10%; font-size: 120px; font-weight: 900;">한국</div>

            <div class="content">
                <span class="badge" data-key="topik-badge">Academic Portal</span>
                <h2>TOPIK</h2>
                <p data-key="topik-desc">Comprehensive training for the Korean Proficiency Test with real-world digital simulations.</p>
                <button class="cta-btn" data-key="enter-btn">Open Application</button>
            </div>
        </a>
    </main>

    <script>
        const translations = {
            en: {
                'ielts-badge': 'Global Standards',
                'topik-badge': 'Academic Portal',
                'ielts-desc': 'Elevate your global career with our precision-engineered mock examinations and analytics.',
                'topik-desc': 'Comprehensive training for the Korean Proficiency Test with real-world digital simulations.',
                'enter-btn': 'Open Application'
            },
            ko: {
                'ielts-badge': '글로벌 스탠다드',
                'topik-badge': '학술 포털',
                'ielts-desc': '정밀하게 설계된 모의고사와 분석 시스템으로 당신의 글로벌 커리어를 높이세요.',
                'topik-desc': '실전 디지털 시뮬레이션을 통해 한국어능력시험을 완벽하게 대비하세요.',
                'enter-btn': '애플리케이션 열기'
            }
        };

        function switchLang(lang) {
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase() === lang);
            });

            document.querySelectorAll('[data-key]').forEach(element => {
                const key = element.getAttribute('data-key');
                element.innerText = translations[lang][key];
            });
        }
    </script>
</body>
</html>
